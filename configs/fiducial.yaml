# Fiducial configuration for the kSZ pipeline
# Machine-specific paths go in configs/local.yaml (gitignored)

# ── Data paths ────────────────────────────────────────────────────────────────
data:
  cache_dir: data/cache/       # 21cmFAST cache — gitignored, stays local
  plot_dir:  data/plots/       # rendered figures — gitignored, stays local
  output_dir: data/products/   # final .npy/.npz products — committed to git

# ── 21cmFAST simulation parameters ───────────────────────────────────────────
21cmfast:
  # Lightcone
  HII_DIM: 128           # lightcone script default
  BOX_LEN: 800.0         # Mpc
  N_THREADS: 32
  random_seed: 37
  z_min: 5.0
  z_max: 20.0

  # Coeval boxes
  HII_DIM_coeval: 512    # coeval script default (kSZBoxes.py)
  # NOTE: lightcone uses 21cmFAST built-in cosmology;
  #       coeval uses astropy.cosmology.Planck18 — small differences expected.

  # Astrophysics
  HII_EFF_FACTOR: 30.0   # fiducial ionizing efficiency ζ

# ── Lightcone kSZ settings ────────────────────────────────────────────────────
lightcone_ksz:
  skew_angle_deg: 10.0
  Nlos: 16384   # = HII_DIM^2, required for the square reshape in ksz_map_to_Dl
  use_patchy_screening: false   # true → e^{-τ(n̂,<z)}, false → e^{-τ̄(z)}

# ── Coeval-box kSZ settings ───────────────────────────────────────────────────
coeval_ksz:
  # Redshift grid used in kSZBoxes.py (ZS list)
  z_snapshots: [16.0, 15.5, 15.0, 14.5, 14.0, 13.5, 13.0, 12.5, 12.0, 11.5,
                11.0, 10.5, 10.0,  9.5,  9.0,  8.5,  8.0,  7.5,  7.0,  6.5,
                 6.0,  5.5,  5.0,  4.5,  4.0,  3.5,  3.0,  2.5,  2.0,  1.5,
                 1.0,  0.5,  0.001]
  chi_proxy_Mpc: 7800.0         # comoving distance proxy for ℓ↔k mapping

# ── Power spectrum ────────────────────────────────────────────────────────────
power_spectrum:
  n_kbins: 35
  ell_min: 100
  ell_max: 31623    # 10^4.5
  n_ell_bins: 80
  T_CMB_K: 2.7255
