# Nikolic, Mesinger, Qin & Gorce (2023, MNRAS 526, 3170 -- arXiv:2307.01265)
# replication configuration.
#
# Targets THEIR INFERENCE box (500 Mpc / 256^3), not their illustrative
# 1.5 Gpc / 1050^3 Figure 1 box -- the latter is well beyond what swarm/pride
# can run and is explicitly flagged in the paper itself as "computationally
# prohibitive" for anything beyond that one demo figure.
#
# Astro params below are the FIGURE 1 values specifically (not their full
# posterior/best-fit), because Figure 1's kSZ curve is what's being digitized
# for comparison here. Figure 1 caption: midpoint of EoR z_r=6.1, ends at
# z_end=4.9, duration dz=0.76, tau_e=0.042.
#
# Reionization-era window: deliberately NOT building a parallel hard z>=5
# cutoff to match their patchy-source definition. Reusing the existing
# xH_mean-threshold clamp (optical_depth.compute_patchy_mask, xe_min/xe_max)
# as-is -- feeding it these astro params should produce a reionization
# history close enough to theirs (z_mid=6.1, z_end=4.9) that the two
# conventions select nearly the same redshift range. Verify the resulting
# xH(z) history after the first run lands close to their stated z_r/z_end
# before trusting the comparison; if it's off, retune astro params to match
# their history rather than their literal parameter values -- the history is
# what the kSZ signal actually depends on.
#
# Cosmology: NOT matched to their Omega_m=0.321, h=0.67, sigma8=0.81 (Planck
# 2020). This pipeline's coeval path uses astropy Planck18 throughout
# (density/velocity fields, comoving-distance proxies, wrap-cycle box-length
# bookkeeping) and rewiring that is a separate, larger change. Treat any
# residual mismatch from this as a documented, secondary systematic relative
# to the much larger box-size/sample-variance and astro-parameter effects
# already in play -- flag it in writeup, don't chase it here unless the
# comparison result turns out to hinge on it.

data:
  cache_dir: data/cache/
  plot_dir:  data/plots/
  output_dir: data/products/

21cmfast:
  HII_DIM: 128
  BOX_LEN: 500.0          # Mpc -- Nikolic et al. 2023 inference box (not Fig.1's 1.5 Gpc)
  N_THREADS: 32
  random_seed: 37
  z_min: 4.0
  z_max: 20.0

  HII_DIM_coeval: 256     # Nikolic et al. 2023 inference resolution (not Fig.1's 1050^3)

  # Astrophysics -- Nikolic et al. 2023 Figure 1 parameters, flexible
  # mass-dependent SFR/escape-fraction model. HII_EFF_FACTOR below is
  # inert once USE_MASS_DEPENDENT_ZETA is true; kept only for reference /
  # any code path that still reads it directly without going through
  # astro_params. See fields.py run_coeval_fields() docstring:
  # astro_params/flag_options must both be wired through for this to
  # actually take effect in 21cmFAST -- confirm the run picked this up
  # (not silently falling back to HII_EFF_FACTOR=30) before trusting results.
  HII_EFF_FACTOR: 30.0
  astro_params:
    F_STAR10:   -1.42     # log10 f*,10
    ALPHA_STAR:  0.614
    F_ESC10:    -1.78     # log10 fesc,10
    ALPHA_ESC:   0.474
    M_TURN:      8.62     # log10 Mturn
    t_STAR:      0.392
  flag_options:
    USE_MASS_DEPENDENT_ZETA: true
    PHOTON_CONS: true

# ── Lightcone kSZ settings (native/ray-traced path -- unchanged, carried
#    over from fiducial.yaml as-is; not exercised by the coeval-stitching
#    replication this config is for) ───────────────────────────────────────
lightcone_ksz:
  skew_angle_deg: 10.0
  Nlos: 16384
  use_patchy_screening: false

# ── Coeval-box kSZ settings ───────────────────────────────────────────────
coeval_ksz:
  # z grid is cosmology/geometry-independent -- unchanged from fiducial.yaml.
  z_snapshots: [20.0, 19.0, 18.0, 17.0, 16.0, 15.5, 15.0, 14.5, 14.0, 13.5,
                13.0, 12.5, 12.0, 11.5, 11.0, 10.5, 10.0,  9.5,  9.0,  8.5,
                 8.0,  7.5,  7.0,  6.5,  6.0,  5.5,  5.0,  4.5,  4.0]
  chi_proxy_Mpc: 7800.0   # comoving distance proxy for ell<->k mapping,
                           # cosmology-dependent not BOX_LEN-dependent --
                           # unchanged from fiducial.yaml.

# ── Convergence sweeps (unused by this replication; carried over so any
#    script reading the whole config doesn't choke on a missing section) ──
convergence:
  dz_multiples: [1, 2, 4]
  fixed_dx_mpc: 6.25
  box_lens: [200, 400, 600, 800, 1000]
  ref_box_len: 800.0
  hii_dims: [32, 64, 128, 256, 512]

# ── Power spectrum ────────────────────────────────────────────────────────
power_spectrum:
  n_kbins: 35
  ell_min: 100
  ell_max: 31623
  n_ell_bins: 80
  T_CMB_K: 2.7255
